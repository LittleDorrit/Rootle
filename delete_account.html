<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request Account Deletion - Rootle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      background: #f4f4f4;
      color: #333;
    }
    h1 {
      color: #0066cc;
    }
    form {
      background: white;
      padding: 2em;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 0.75em;
      margin-top: 1em;
      font-size: 1em;
    }
    .success {
      color: green;
      margin-top: 1em;
    }
    .error {
      color: red;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <h1>Request Account Deletion</h1>
  <p>Please fill out the form below to request deletion of your Rootle account and associated data.</p>

  <form id="delete-form">
    <label for="email">Email associated with your account:</label>
    <input type="email" id="email" name="email" required />

    <button type="submit">Request Deletion</button>
    <p id="response" class=""></p>
  </form>

  <script>
    const form = document.getElementById("delete-form");
    const responseEl = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      responseEl.textContent = "Submitting request...";
      responseEl.className = "";

      const email = document.getElementById("email").value;

      try {
        const res = await fetch("https://deleteuseraccount-jkmj6daoaq-uc.a.run.app", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (res.ok) {
          responseEl.textContent = data.message || "Account deletion request submitted successfully.";
          responseEl.className = "success";
        } else {
          responseEl.textContent = data.error || "Failed to process request.";
          responseEl.className = "error";
        }
      } catch (error) {
        responseEl.textContent = "Error: " + error.message;
        responseEl.className = "error";
      }
    });
  </script>
</body>
</html>
